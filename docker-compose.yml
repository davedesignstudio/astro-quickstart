services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:6.7-php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/wp-content/plugins/restaurant-order-print:/var/www/html/wp-content/plugins/restaurant-order-print
      - ./wordpress/wp-content/themes/restaurant-ordering:/var/www/html/wp-content/themes/restaurant-ordering

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/wp-content/plugins/restaurant-order-print:/var/www/html/wp-content/plugins/restaurant-order-print
      - ./wordpress/wp-content/themes/restaurant-ordering:/var/www/html/wp-content/themes/restaurant-ordering
      - ./scripts:/scripts
    entrypoint: ["sh", "/scripts/wp-init.sh"]
    restart: "no"

volumes:
  db_data:
  wp_data:
