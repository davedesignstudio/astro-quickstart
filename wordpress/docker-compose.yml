services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:6.6-php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/plugins/restaurant-order-system:/var/www/html/wp-content/plugins/restaurant-order-system
      - ./scripts/setup-wordpress.sh:/docker-entrypoint-init.d/99-setup-wordpress.sh:ro

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WP_PORT: ${WP_PORT:-8080}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-changeme}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@restaurant.local}
      WP_SITE_TITLE: ${WP_SITE_TITLE:-Restaurant Online Ordering}
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/plugins/restaurant-order-system:/var/www/html/wp-content/plugins/restaurant-order-system
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/wp-setup-once.sh"]
    restart: "no"

volumes:
  db_data:
  wp_data:
