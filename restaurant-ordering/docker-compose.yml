services:
  plugin-deps:
    image: composer:2
    volumes:
      - ./wp-content/plugins/restaurant-order-print:/app
    working_dir: /app
    command: install --no-dev --optimize-autoloader --ignore-platform-reqs
    restart: "no"

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:6.7-php8.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/plugins/restaurant-order-print:/var/www/html/wp-content/plugins/restaurant-order-print

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      wordpress:
        condition: service_started
      plugin-deps:
        condition: service_completed_successfully
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/plugins/restaurant-order-print:/var/www/html/wp-content/plugins/restaurant-order-print
      - ./scripts/setup-wordpress.sh:/setup-wordpress.sh:ro
    entrypoint: ["sh", "/setup-wordpress.sh"]
    restart: "no"

volumes:
  db_data:
  wp_data:
